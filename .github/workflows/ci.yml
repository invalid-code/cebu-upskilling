# CI/CD pipeline for Cebu Upskilling.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   PROD_DATABASE_URL   Full Postgres connection string for the
#                       production DB (used by the dedicated
#                       `dotnet ef database update` step).
#   DOCKERHUB_USERNAME  Docker Hub username (used to authenticate push).
#   DOCKERHUB_TOKEN     Docker Hub access token (with push rights).
#   DOCKER_IMAGE        Full image repo WITHOUT tag, e.g.
#                       docker.io/invalidjess/cebu-upskilling
#                       (CI appends :latest and :sha-<commit>).
#   DEPLOY_HOOK_URL     Optional Render "Deploy Hook" URL. If your
#                       Render service has Auto-Deploy enabled on the
#                       Docker Hub repo, this is not required (the push
#                       alone triggers the redeploy).
#   EXPO_TOKEN          Expo access token (expo.dev > Account > Access
#                       Tokens) used by the `mobile-build` job to run
#                       EAS builds non-interactively.
#   PROD_API_URL        Public production backend URL, e.g.
#                       https://cebu-upskilling.onrender.com/api — baked
#                       into the mobile bundle as EXPO_PUBLIC_API_URL
#                       (App.js falls back to http://localhost:5000/api).
#   SENTRY_DSN_MOBILE   Sentry DSN of the mobile project — baked into the
#                       mobile bundle as EXPO_PUBLIC_SENTRY_DSN. Empty is
#                       allowed (error tracking stays disabled in the bundle).
#   POSTHOG_KEY_MOBILE  PostHog project API key (phc_…) — baked into the
#                       mobile bundle as EXPO_PUBLIC_POSTHOG_KEY. Empty is
#                       allowed (analytics stays opted-out in the bundle).
#   POSTHOG_HOST_MOBILE PostHog host, e.g. https://us.i.posthog.com.
#                       Defaults to the US host when empty.
# One-time EAS setup (not done by CI — run locally once):
#   1. `npx eas-cli@latest init` inside mobile/ to link app.json to the
#      Expo project (writes extra.eas.projectId).
#   2. For iOS: connect an Apple Developer account in the Expo dashboard
#      (Credentials) so cloud builds can sign the .ipa.
# Note: the frontend is deployed by Vercel's own Git auto-deploy on
#       push, so the CI pipeline only builds/tests the backend and
#       runs the frontend test suite. Set VITE_API_URL in the Vercel
#       project's env so the frontend calls the correct backend URL
#       in production. Mobile production binaries (.aab/.ipa) are built
#       by the `mobile-build` job via EAS cloud build.

name: CI/CD

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # No database service: the backend suite runs against EF Core InMemory
    # (ProductionApiFactory) with faked R2/Gemini, so no Postgres is needed.
    env:
      Jwt__Key: ci-signing-key-that-is-at-least-32-characters
      Jwt__Issuer: CebuUpskilling
      Jwt__Audience: CebuUpskillingApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test with coverage
        run: >-
          dotnet test
          CebuUpskilling.Backend.Tests/CebuUpskilling.Backend.Tests.csproj
          --settings CebuUpskilling.Backend.Tests/coverlet.runsettings --nologo

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: CebuUpskilling.Backend.Tests/TestResults/**/coverage.cobertura.xml  # yamllint disable-line rule:line-length
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  frontend-ship-gate:
    name: Frontend ship gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs unit tests, lint, build, bundle-size/chunk checks and the Playwright
      # suite; fails the job and names each failing check (Reqs 25.6, 25.7).
      - name: Ship gate
        run: npm run ship-gate

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  mobile-build:
    name: Mobile production build (EAS)
    needs: [backend, frontend, frontend-ship-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    concurrency:
      group: mobile-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_MOBILE }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY_MOBILE }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST_MOBILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@24

      # Fail fast: without PROD_API_URL the bundle would silently bake in
      # the localhost fallback from App.js and every API call would fail.
      - name: Check production API URL is set
        run: '[ -n "$EXPO_PUBLIC_API_URL" ] || (echo "PROD_API_URL secret is not set" && exit 1)'

      # Sentry/PostHog keys are optional: the bundle degrades gracefully
      # (tracking stays disabled) when they are empty. Warn so a missing
      # secret is noticed rather than shipping blind silently.
      - name: Check observability keys are set
        run: |
          [ -n "$EXPO_PUBLIC_SENTRY_DSN" ] || echo "::warning::SENTRY_DSN_MOBILE secret is not set — mobile build will ship without error tracking."
          [ -n "$EXPO_PUBLIC_POSTHOG_KEY" ] || echo "::warning::POSTHOG_KEY_MOBILE secret is not set — mobile build will ship without analytics."

      # Queues a production cloud build for Android (.aab) and iOS (.ipa)
      # using mobile/eas.json. Waits for completion so a failed build fails
      # the job (add --no-wait to queue-and-exit instead).
      - name: Production build (Android + iOS)
        run: eas build --platform all --profile production --non-interactive

  deploy:
    name: Deploy (migrate + backend)
    needs: [backend, frontend, frontend-ship-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKER_IMAGE }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install dotnet-ef (matching EF Core 9.0)
        run: >-
          dotnet tool update --global dotnet-ef --version 9.0.*
          2>/dev/null || dotnet tool install --global dotnet-ef --version 9.0.*

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dedicated migration step: brings the production DB schema up to date
      # before the new backend image is deployed.
      - name: Apply database migrations
        working-directory: CebuUpskilling.Backend
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_DATABASE_URL }}
          DOTNET_ROLL_FORWARD: Major
        run: dotnet ef database update

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./CebuUpskilling.Backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Trigger backend deploy (Render / Railway)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL not set, skipping."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
