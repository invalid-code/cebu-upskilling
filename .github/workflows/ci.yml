# CI/CD pipeline for Cebu Upskilling.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   PROD_DATABASE_URL   Full Postgres connection string for the production DB
#                       (used by the dedicated `dotnet ef database update` step).
#   DOCKERHUB_USERNAME  Docker Hub username (used to authenticate the push).
#   DOCKERHUB_TOKEN     Docker Hub access token (with push rights).
#   DOCKER_IMAGE        Full image repo WITHOUT tag, e.g.
#                       docker.io/invalidjess/cebu-upskilling
#                       (CI appends :latest and :sha-<commit>).
#   DEPLOY_HOOK_URL     Optional Render "Deploy Hook" URL. If your Render service
#                       has Auto-Deploy enabled on the Docker Hub repo, this is
#                       not required (the push alone triggers the redeploy).
# Note: the frontend is deployed by Vercel's own Git auto-deploy on push, so the
#       CI pipeline only handles the backend. Set VITE_API_URL in the Vercel
#       project's env so the frontend calls the correct backend URL in production.


name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cebu_upskilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=cebu_upskilling_test;Username=postgres;Password=postgres
      Jwt__Key: ci-signing-key-that-is-at-least-32-characters
      Jwt__Issuer: CebuUpskilling
      Jwt__Audience: CebuUpskillingApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test with coverage
        run: dotnet test CebuUpskilling.Backend.Tests/CebuUpskilling.Backend.Tests.csproj --settings CebuUpskilling.Backend.Tests/coverlet.runsettings --nologo

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: CebuUpskilling.Backend.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  deploy:
    name: Deploy (migrate + backend)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKER_IMAGE }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install dotnet-ef (matching EF Core 9.0)
        run: dotnet tool update --global dotnet-ef --version 9.0.* 2>/dev/null || dotnet tool install --global dotnet-ef --version 9.0.*

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dedicated migration step: brings the production DB schema up to date
      # before the new backend image is deployed.
      - name: Apply database migrations
        working-directory: CebuUpskilling.Backend
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_DATABASE_URL }}
          DOTNET_ROLL_FORWARD: Major
        run: ef database update

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./CebuUpskilling.Backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Trigger backend deploy (Render / Railway)
        if: ${{ secrets.DEPLOY_HOOK_URL != '' }}  
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$DEPLOY_HOOK_URL"
