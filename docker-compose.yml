services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cebuupskilling}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cebuupskilling}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./CebuUpskilling.Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-cebuupskilling};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__Issuer: ${JWT_ISSUER:-cebu-upskilling}
      Jwt__Audience: ${JWT_AUDIENCE:-cebu-upskilling-frontend}
      R2__AccountId: ${R2_ACCOUNT_ID:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__BucketName: ${R2_BUCKET_NAME:-}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-}
      GoogleAi__ApiKey: ${GOOGLE_AI_API_KEY:-}
      GoogleAi__Model: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      GoogleAi__BaseUrl: ${GOOGLE_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://cebu-upskilling.vercel.app}
    ports:
      - "8080:8080"
    volumes:
      - api-logs:/app/logs
      - uploads-data:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
  api-logs:
  uploads-data: